"$schema": "http://json-schema.org/draft-07/schema#"
title: ChIP-seq peak calling + consensus + QC — configuration
description: >-
  Parameters for the ChIP-seq peak-calling (with matched input/IgG control),
  consensus-peak and QC workflow. File paths are relative to the working
  directory (the repo root).
type: object

properties:

  samples_table:
    type: string
    description: >-
      Path to the sample sheet CSV. Columns: sample_id, condition, replicate,
      input_control, igg_control, peak_mode, notes. peak_mode (narrow/broad) and
      the matched Input and IgG controls are set per sample; per-condition
      reproducibility (majority vote / IDR / single) is derived from the
      replicate count.
    default: config/samples.csv

  control_type:
    type: string
    enum: [input, igg]
    description: >-
      Which control each IP sample uses as the MACS2 -c control: 'input' (the
      default) uses the sample's input_control, 'igg' uses its igg_control. If the
      selected column is empty for a sample, the other is used as a fallback; if
      both are empty, peaks are called treatment-only.
    default: input

  adapter_r1:
    type: string
    description: >-
      Optional. Explicit R1 adapter sequence that OVERRIDES fastp
      auto-detection. Leave unset to auto-detect adapters for paired-end reads
      (--detect_adapter_for_pe).
  adapter_r2:
    type: string
    description: Optional. Explicit R2 adapter sequence (used together with adapter_r1).

  human_fasta:
    type: string
    description: >-
      Human genome FASTA. Must be chr-prefixed UCSC (chr1..chrX) to match the
      blacklist.
    default: ref/hg38.fa
  bowtie2_index:
    type: string
    description: >-
      Bowtie2 index prefix for the human reference (created automatically by the
      build_bowtie2_index rule from human_fasta, optionally subset to align_chroms).
    default: ref/BOWTIE2/genome
  align_chroms:
    type: array
    items:
      type: string
    description: >-
      Human chromosomes kept when building the index (reads then align only to
      these). Use an empty list to keep all human chromosomes.
  keep_chroms:
    type: array
    items:
      type: string
    description: >-
      Analysis keep-set for the final BAM (mito-% QC is recorded first). Must be
      a subset of align_chroms and consistent with keep_chroms_regex.
  blacklist:
    type: string
    description: ENCODE-style blacklist BED (chr-prefixed).
    default: ref/hg38_blacklist_regions.bed

  macs2_genome:
    type: string
    description: MACS2 -g effective genome preset (e.g. hs, mm, ce, dm).
    default: hs
  macs2_qvalue:
    type: number
    minimum: 0
    maximum: 1
    description: MACS2 -q FDR cutoff for the final peak calls (narrow and broad).
    default: 0.05
  broad_cutoff:
    type: number
    minimum: 0
    maximum: 1
    description: MACS2 --broad-cutoff for broad-mode peak calls.
    default: 0.1

  effective_genome_size:
    type: integer
    minimum: 1
    description: Effective genome size for deepTools RPGC normalization (hg38 default).
    default: 2913022398
  bin_size:
    type: integer
    minimum: 1
    description: bigWig bin size in bp.
    default: 25

  consensus_window:
    type: integer
    minimum: 1
    description: Fixed consensus peak width around each summit, in bp.
    default: 500
  consensus_min_replicates:
    type: integer
    minimum: 1
    description: Majority-vote threshold for conditions with >=3 replicates.
    default: 2
  idr_threshold:
    type: number
    minimum: 0
    maximum: 1
    description: IDR threshold for conditions with exactly 2 replicates.
    default: 0.05
  idr_relaxed_pvalue:
    type: number
    minimum: 0
    maximum: 1
    description: MACS2 -p value for the relaxed peak calls used as IDR input.
    default: 0.1
  idr_top_n_peaks:
    type: integer
    minimum: 1
    description: Number of top relaxed peaks retained per replicate for IDR.
    default: 150000
  keep_chroms_regex:
    type: string
    description: >-
      Regex used by the consensus step to filter chromosomes; keep consistent
      with keep_chroms.
    default: "^chr([1-9]|1[0-9]|2[0-2]|X)$"

  contrasts:
    type: array
    description: >-
      Differential-binding contrasts (DESeq2 over the consensus count matrix).
      Each entry names two conditions (from the sample sheet's `condition` column)
      to compare. Empty list = skip differential binding.
    default: []
    items:
      type: object
      properties:
        name:
          type: string
          description: Label for the contrast (used in output filenames).
        condition_a:
          type: string
          description: Test condition (numerator; log2FC > 0 means higher in A).
        condition_b:
          type: string
          description: Reference condition (denominator).
      required: [name, condition_a, condition_b]

  gtf:
    type: string
    description: GENCODE GTF (chr-prefixed) used for TSS-signal QC.
    default: ref/gencode.v36.annotation.gtf
  promoter_bed:
    type: string
    description: Promoter BED used for the reads-in-annotation QC.
    default: ref/promoter_chr1-22X.bed
  enhancer_bed:
    type: string
    description: Enhancer BED used for the reads-in-annotation QC.
    default: ref/enhancer_chr1-22X.bed

required:
  - samples_table
  - control_type
  - human_fasta
  - bowtie2_index
  - align_chroms
  - keep_chroms
  - blacklist
  - macs2_genome
  - macs2_qvalue
  - broad_cutoff
  - effective_genome_size
  - bin_size
  - consensus_window
  - consensus_min_replicates
  - idr_threshold
  - idr_relaxed_pvalue
  - idr_top_n_peaks
  - keep_chroms_regex
  - gtf
  - promoter_bed
  - enhancer_bed
