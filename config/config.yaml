# ChIP-seq analysis configuration

# Sample sheet (columns: sample_id, condition, replicate, input_control, peak_mode, notes)
samples_table: "config/samples.csv"

# Adapter trimming: fastp AUTO-DETECTS adapters for paired-end reads by default
# (--detect_adapter_for_pe). To force specific adapters instead — which OVERRIDES
# auto-detection — uncomment adapter_r1/adapter_r2 below (Illumina defaults shown).
# adapter_r1: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
# adapter_r2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"

# ── Alignment: human reference ──────────────────────────────────────────
# Human genome FASTA (you provide; MUST be chr-prefixed UCSC to match the blacklist)
human_fasta: "ref/hg38.fa"
# Bowtie2 index prefix (human only), built automatically by build_bowtie2_index
bowtie2_index: "ref/BOWTIE2/genome"
# Restrict the HUMAN genome to these chromosomes before building the index (reads
# then align only to these). Set to [] to keep ALL human chroms.
align_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrM]
# Analysis keep-set for the final BAM: mito-% QC is recorded first, then reads are
# restricted to these chroms (drop chrM/chrY/non-primary). MUST be a subset of
# align_chroms, and kept consistent with keep_chroms_regex (consensus).
keep_chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX]

# Blacklist regions file
blacklist: "ref/hg38_blacklist_regions.bed"

# ── Peak calling (MACS2) ────────────────────────────────────────────────
# Peak mode (narrow/broad) and the matched Input/IgG controls are set PER SAMPLE
# in config/samples.csv. `control_type` chooses which control drives peak calling
# across the run: "input" (default) uses each IP's input_control, "igg" uses its
# igg_control (falling back to the other column if the chosen one is empty).
control_type: "input"                # "input" (default) or "igg"
macs2_genome: "hs"                   # MACS2 -g effective genome preset
macs2_qvalue: 0.05                   # MACS2 -q FDR cutoff (narrow and broad)
broad_cutoff: 0.1                    # MACS2 --broad-cutoff (broad mode only)

# ── deepTools bigWig settings ───────────────────────────────────────────
effective_genome_size: 2913022398    # hg38 experimental genome (RPGC track)
bin_size: 25

# ── Consensus peaks & fragment counting ─────────────────────────────────
consensus_window: 500                # fixed peak width around summit (bp)
consensus_min_replicates: 2          # majority-vote threshold (conditions with >=3 reps)
idr_threshold: 0.05                  # IDR threshold (conditions with exactly 2 reps)
idr_relaxed_pvalue: 0.1              # MACS2 -p for relaxed calls (IDR input)
idr_top_n_peaks: 150000              # top-N relaxed peaks retained for IDR
keep_chroms_regex: "^chr([1-9]|1[0-9]|2[0-2]|X)$"   # primary autosomes + chrX

# ── Downstream analysis (workflow/rules/downstream.smk) ─────────────────
# Differential-binding contrasts (DESeq2 over the consensus count matrix). Each
# entry compares two conditions from samples.csv. Leave empty ([]) to skip.
# Replicates per condition are recommended (1-vs-1 runs but gives fold-change only).
contrasts:
  - name: cJUN_3D_vs_Ctrl
    condition_a: "3D_cJUN"
    condition_b: "Ctrl_cJUN"

# ── QC pipeline (workflow/rules/qc.smk) ─────────────────────────────────
gtf: "ref/gencode.v36.annotation.gtf"          # for TSS-signal QC (chr-prefixed GENCODE)
promoter_bed: "ref/promoter_chr1-22X.bed"       # reads-in-annotation QC
enhancer_bed: "ref/enhancer_chr1-22X.bed"
